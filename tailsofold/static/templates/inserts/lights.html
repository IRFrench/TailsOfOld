{{define "insert"}}
<style>
    .switch {
        position: relative;
        width: 80px;
        height: 80px;
        background: linear-gradient(#eee, #ccc, #eee);
        border: 3px solid #000;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .switch .btn {
        position: relative;
        width: 25px;
        height: 40px;
        background: linear-gradient(#777, #fff, #777);
        border-radius: 6px;
        border: 2px solid #000;
        cursor: pointer;
    }

    .switch .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 85%;
        background: linear-gradient(#fff, #fff);
        border-radius: 4px;
    }

    .btn.on::before {
        top: 15%;
    }

    .switchboard {
        display: flex;
        gap: 1rem;
    }

    .bulb {
        position: relative;
        width: 80px;
        height: 80px;
    }

    .overlay {
        position: absolute;
        width: 100%;
    }

    .lightsource {
        border-radius: 100rem;
        left: 12px;
        width: 70%;
        height: 76%;
        position: absolute;
    }

    .lit {
        box-shadow:
            1rem 1rem 4rem yellow,
            -1rem -1rem 4rem yellow;
        background: yellow;
    }

    .problem {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        align-items: center;
    }
</style>
<script>
    function togglelight() {
        document.querySelector('.lightsource').classList.toggle('lit');
    }
</script>
<div class="problem">
    <div class="switchboard">
        <div class="switch">
            <button class="btn" onclick="this.classList.toggle('on'); togglelight()">
            </button>
        </div>
        <div class="switch">
            <button class="btn" onclick="this.classList.toggle('on'); togglelight()">
            </button>
        </div>
        <div class="switch">
            <button class="btn" onclick="this.classList.toggle('on'); togglelight()">
            </button>
        </div>
    </div>
    <div class="bulb">
        <div class="lightsource lit"></div>
        <div class="overlay">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-lightbulb" viewBox="0 0 16 16">
                <path
                    d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13a.5.5 0 0 1 0 1 .5.5 0 0 1 0 1l-.224.447a1 1 0 0 1-.894.553H6.618a1 1 0 0 1-.894-.553L5.5 15a.5.5 0 0 1 0-1 .5.5 0 0 1 0-1 .5.5 0 0 1-.46-.302l-.761-1.77a2 2 0 0 0-.453-.618A5.98 5.98 0 0 1 2 6m6-5a5 5 0 0 0-3.479 8.592c.263.254.514.564.676.941L5.83 12h4.342l.632-1.467c.162-.377.413-.687.676-.941A5 5 0 0 0 8 1" />
            </svg>
        </div>
    </div>
</div>
{{end}}
